<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#06C755">
  <title>アレグリア 店長メニュー</title>
  <link rel="stylesheet" href="css/style.css?v=20260626-pending-member">
  <style>
    /* ===================================================================
       店長トップ 新UI。style.css は変更しない（ページ内スコープ）。
       方針: 緑はヘッダー・主ボタン・アクセントに限定 / カード白・角丸16px /
             提出状況を最上位 / 補助機能は下部リスト型。
    =================================================================== */

    /* --- コンパクトヘッダー（ホーム専用。詳細画面は従来の screen-header を使う） --- */
    .mgr-home-header {
      background: var(--color-primary);
      color: #fff;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .mgr-home-header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.02em; }
    .mgr-home-login { font-size: 0.8rem; opacity: 0.92; margin-top: 2px; }

    /* --- 白カード共通（角丸16px・余白広め） --- */
    .mgr-panel {
      background: #fff;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    /* --- 店舗切替カード（掛け持ち店長のみ表示） --- */
    .mgr-switch-title { font-size: 0.85rem; font-weight: 700; margin: 0 0 10px; }
    .mgr-switch-tabs { display: flex; gap: 8px; }
    .mgr-switch-tab {
      flex: 1; padding: 10px 4px; border-radius: 12px;
      font-size: 0.95rem; font-weight: 600;
      border: 1px solid var(--color-border); background: #fff; color: var(--color-text-sub);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mgr-switch-tab.on {
      border: 2px solid var(--color-primary); background: #f0fdf4;
      color: var(--color-primary-dk); font-weight: 700;
    }

    /* --- 提出状況カード（最上位・最重要） --- */
    .mgr-sub-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 14px;
    }
    .mgr-panel-title { font-size: 1rem; font-weight: 700; }
    .mgr-period-chip {
      font-size: 0.78rem; font-weight: 600; color: var(--color-primary-dk);
      background: #e8f8ee; border-radius: 999px; padding: 4px 10px; white-space: nowrap;
    }
    .mgr-sub-grid { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .mgr-donut {
      --pct: 0;
      width: 108px; height: 108px; border-radius: 50%; flex: 0 0 auto;
      background: conic-gradient(var(--color-primary) calc(var(--pct) * 1%), #e5e9ef 0);
      display: flex; align-items: center; justify-content: center;
    }
    .mgr-donut-hole {
      width: 80px; height: 80px; border-radius: 50%; background: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      line-height: 1.15;
    }
    .mgr-donut-num { font-size: 1.7rem; font-weight: 700; color: var(--color-primary-dk); }
    .mgr-donut-den { font-size: 0.75rem; color: var(--color-text-sub); }
    .mgr-stats { flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .mgr-stat {
      display: flex; align-items: center; gap: 8px;
      background: #f5f7fa; border-radius: 12px; padding: 10px 12px; font-size: 0.9rem;
    }
    .mgr-stat strong { margin-left: auto; font-size: 1.25rem; font-weight: 700; }
    .mgr-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .mgr-stat.ok .mgr-dot { background: var(--color-primary); }
    .mgr-stat.ng .mgr-dot { background: var(--color-danger); }
    .mgr-stat.ok strong { color: var(--color-primary-dk); }
    .mgr-stat.ng strong { color: var(--color-danger); }

    /* --- シフト表カード（中ボタン） --- */
    .mgr-sheet-panel { display: flex; align-items: center; gap: 12px; }
    .mgr-sheet-icon { font-size: 1.6rem; flex: 0 0 auto; }
    .mgr-sheet-body { flex: 1 1 auto; min-width: 0; }
    .mgr-sheet-title { font-size: 0.95rem; font-weight: 700; }
    .mgr-sheet-sub { font-size: 0.75rem; color: var(--color-text-sub); margin-top: 2px; }
    .mgr-sheet-open {
      flex: 0 0 auto; text-decoration: none; font-size: 0.85rem; font-weight: 700;
      color: var(--color-primary-dk); border: 1.5px solid var(--color-primary);
      border-radius: 10px; padding: 9px 14px; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .mgr-sheet-open:active { background: #f0fdf4; }

    /* --- その他の操作（リスト型） --- */
    .mgr-ops-heading { font-size: 0.85rem; font-weight: 700; color: var(--color-text-sub); margin: 20px 4px 8px; }
    .mgr-ops-list {
      background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 14px;
    }
    .mgr-ops-row {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px;
      background: #fff; border: none; text-align: left; cursor: pointer;
      font: inherit; color: var(--color-text);
      -webkit-tap-highlight-color: transparent;
    }
    .mgr-ops-row + .mgr-ops-row { border-top: 1px solid var(--color-border); }
    .mgr-ops-row:active { background: #f5f7fa; }
    .mgr-ops-icon { font-size: 1.3rem; flex: 0 0 auto; }
    .mgr-ops-body { flex: 1 1 auto; min-width: 0; }
    .mgr-ops-title { display: block; font-size: 0.95rem; font-weight: 700; }
    .mgr-ops-sub { display: block; font-size: 0.75rem; color: var(--color-text-sub); margin-top: 1px; }
    .mgr-ops-chevron { color: #b9c2cc; font-size: 1.2rem; flex: 0 0 auto; }

    /* --- ヘルプ誘導帯 --- */
    .mgr-hint {
      display: block; width: 100%; border: none; cursor: pointer;
      background: #e8f8ee; color: var(--color-primary-dk); border-radius: 12px;
      font-size: 0.8rem; padding: 12px 14px; text-align: center; font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }

    /* --- ガード画面（現行踏襲: 中央寄せの縦積み） --- */
    #screen-not-manager.active,
    #screen-unlinked.active { display: flex; }
    #screen-not-manager,
    #screen-unlinked {
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px 24px;
    }
  </style>
</head>
<body>

  <!-- ===========================================================
       画面1: ローディング
  ============================================================ -->
  <section id="screen-loading" class="screen active">
    <p class="loading-logo">アレグリア</p>
    <p class="loading-sub">店長メニュー</p>
    <div class="spinner" role="status" aria-label="読み込み中"></div>
  </section>

  <!-- ===========================================================
       画面2: 店長トップ（新UI）
       構成: コンパクトヘッダー → 店舗切替 → 提出状況（最上位）
             → シフト表 → その他の操作 → ヘルプ誘導
  ============================================================ -->
  <section id="screen-home" class="screen">
    <header class="mgr-home-header">
      <h1>📍 <span id="mgr-store-name">店長メニュー</span></h1>
      <p class="mgr-home-login">ログイン中: <span id="mgr-user-name"></span></p>
    </header>
    <div class="screen-body">

      <!-- 店舗切替（掛け持ち店長のときだけ ManagerHome._renderStoreSwitch() が表示） -->
      <div id="mgr-store-switch" class="mgr-panel" style="display:none"></div>

      <!-- 提出状況カード（ManagerHome.showHome() が中身を描画） -->
      <div id="mgr-submission-card" class="mgr-panel">
        <p class="loading-text">提出状況を読み込み中…</p>
      </div>

      <!-- シフト表カード。spreadsheet_id/sheet_gid がそろっている店だけ
           ManagerHome._renderSheetButton() が中身を描画する。 -->
      <div id="mgr-sheet-card"></div>

      <!-- 補助機能（下部リスト型） -->
      <p class="mgr-ops-heading">その他の操作</p>
      <div class="mgr-ops-list">
        <button class="mgr-ops-row" onclick="ManagerHome.openMembers()">
          <span class="mgr-ops-icon" aria-hidden="true">👥</span>
          <span class="mgr-ops-body">
            <span class="mgr-ops-title">メンバー管理</span>
            <span class="mgr-ops-sub">スタッフの追加・編集</span>
          </span>
          <span class="mgr-ops-chevron" aria-hidden="true">›</span>
        </button>
        <button class="mgr-ops-row" onclick="location.href='help.html?v=20260706'">
          <span class="mgr-ops-icon" aria-hidden="true">❓</span>
          <span class="mgr-ops-body">
            <span class="mgr-ops-title">使い方・ヘルプ</span>
            <span class="mgr-ops-sub">操作方法やよくある質問を確認</span>
          </span>
          <span class="mgr-ops-chevron" aria-hidden="true">›</span>
        </button>
      </div>

      <button class="mgr-hint" onclick="location.href='help.html?v=20260706'">
        💡 わからないことがあれば、ヘルプをご覧ください。
      </button>

    </div>
  </section>

  <!-- ===========================================================
       画面3: 提出状況の詳細一覧（現行と同一）
  ============================================================ -->
  <section id="screen-detail" class="screen">
    <header class="screen-header home-header-manager">
      <h1>提出状況の詳細</h1>
      <p class="screen-subtitle" id="mgr-detail-period"></p>
    </header>
    <div class="screen-body">
      <p class="manage-summary" id="mgr-detail-summary"></p>
      <div id="mgr-detail-list" class="manage-member-list"></div>
      <button class="btn-secondary mt-16" onclick="ManagerHome.showHome()">店長トップへ戻る</button>
    </div>
  </section>

  <!-- ===========================================================
       画面3b: 個別スタッフの提出明細（現行と同一）
  ============================================================ -->
  <section id="screen-member-detail" class="screen">
    <header class="screen-header home-header-manager">
      <h1>提出内容</h1>
      <p class="screen-subtitle" id="mgr-member-name"></p>
    </header>
    <div class="screen-body">
      <div id="mgr-member-detail-list" class="confirm-shift-list"></div>
      <button class="btn-secondary mt-16" onclick="ManagerHome.openDetail()">一覧へ戻る</button>
    </div>
  </section>

  <!-- ===========================================================
       画面4: スタッフが開いたとき（店長専用ガード・現行と同一）
  ============================================================ -->
  <section id="screen-not-manager" class="screen">
    <div class="error-icon">🔒</div>
    <h2 class="error-title">このページは店長専用です</h2>
    <p class="info-text">
      シフトの提出・確認は「シフト提出」メニューからご利用ください。
    </p>
    <button class="btn-primary" style="max-width:280px" onclick="location.href='submit-v2.html'">
      シフト提出へ
    </button>
  </section>

  <!-- ===========================================================
       画面5: 未紐付け（現行と同一）
  ============================================================ -->
  <section id="screen-unlinked" class="screen">
    <div class="error-icon">📝</div>
    <h2 class="error-title">まず名前を登録してください</h2>
    <p class="info-text">
      ご利用の前に、シフト提出アプリでお名前の登録をお願いします。<br>
      登録後、このページを開き直してください。
    </p>
    <button class="btn-primary" style="max-width:280px" onclick="location.href='submit-v2.html'">
      名前を登録する
    </button>
  </section>

  <!-- ===========================================================
       画面6: エラー画面（現行と同一）
  ============================================================ -->
  <section id="screen-error" class="screen">
    <div class="error-icon">⚠️</div>
    <h2 class="error-title">エラーが発生しました</h2>
    <p id="error-message"></p>
    <button class="btn-primary" style="max-width:280px" onclick="location.reload()">
      再試行する
    </button>
  </section>

  <!-- トースト通知 -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ===========================================================
       スクリプト読み込み順序:
         1. LIFF SDK / supabase-js（CDN）
         2. config_v2.js    ← CONFIG_V2
         3. api_v2.js       ← SupaAPI
         4. manager_home.js ← MgrState, ManagerHome, initApp
  ============================================================ -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config_v2.js?v=20260613-v5"></script>
  <script src="js/api_v2.js?v=20260726-v3-include-flag"></script>
  <script src="js/manager_home.js?v=20260706-v4-newui"></script>

</body>
</html>
